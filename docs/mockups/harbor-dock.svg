<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Windows Bar Harbor dock concept</title>
  <desc id="description">A Windows desktop concept showing a compact floating glass dock, centered app icons, status tiles, and an opaque media popup.</desc>
  <defs>
    <linearGradient id="wall" x2="1" y2="1">
      <stop stop-color="#101827"/>
      <stop offset=".52" stop-color="#263e50"/>
      <stop offset="1" stop-color="#101620"/>
    </linearGradient>
    <linearGradient id="hill" x2="0" y2="1">
      <stop stop-color="#415e70"/>
      <stop offset="1" stop-color="#172632"/>
    </linearGradient>
    <linearGradient id="dock" x2="0" y2="1">
      <stop stop-color="#252d39" stop-opacity=".88"/>
      <stop offset="1" stop-color="#121821" stop-opacity=".94"/>
    </linearGradient>
    <linearGradient id="tile" x2="0" y2="1">
      <stop stop-color="#dce8f7" stop-opacity=".11"/>
      <stop offset="1" stop-color="#c6d6eb" stop-opacity=".045"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope=".38"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .muted { fill: #abb8ca; }
      .white { fill: #f4f7fc; }
      .label { font-size: 11px; letter-spacing: .7px; }
      .value { font-size: 22px; font-weight: 650; }
      .caption { font-size: 12px; }
    </style>
  </defs>

  <!-- Original abstract desktop artwork; the dock remains readable over changing wallpaper. -->
  <rect width="1440" height="900" fill="url(#wall)"/>
  <circle cx="1110" cy="220" r="175" fill="#6aa1c0" opacity=".22" filter="url(#blur)"/>
  <circle cx="380" cy="360" r="220" fill="#8a719d" opacity=".18" filter="url(#blur)"/>
  <path d="M0 545 Q190 420 360 520 T720 480 T1080 520 T1440 430 V900 H0Z" fill="url(#hill)" opacity=".88"/>
  <path d="M0 665 Q220 530 460 654 T920 620 T1440 660 V900 H0Z" fill="#13212c" opacity=".82"/>
  <path d="M0 760 Q260 660 500 750 T980 725 T1440 760 V900 H0Z" fill="#101820" opacity=".78"/>

  <text x="72" y="76" fill="#f4f7fc" font-size="19" font-weight="650">WINDOWS BAR</text>
  <text x="72" y="101" class="muted" font-size="13">HARBOR · DOCK CONCEPT</text>
  <rect x="1265" y="57" width="103" height="32" rx="16" fill="#17212d" stroke="#abb8ca" stroke-opacity=".25"/>
  <circle cx="1284" cy="73" r="4" fill="#5fa8ff"/>
  <text x="1297" y="78" class="white" font-size="12">Windows 11</text>

  <!-- Opaque detail popup: intentionally placed above and aligned to its source tile. -->
  <g filter="url(#shadow)">
    <rect x="748" y="498" width="314" height="196" rx="18" fill="#171c24" stroke="#c4d2e6" stroke-opacity=".17"/>
    <rect x="768" y="518" width="44" height="44" rx="11" fill="#354c68"/>
    <path d="M782 531h16v18h-16z M786 527h16v18" fill="none" stroke="#d6e5f5" stroke-width="2" stroke-linejoin="round"/>
    <text x="824" y="537" class="white" font-size="15" font-weight="650">Now playing</text>
    <text x="824" y="557" class="muted" font-size="11">MEDIA CONTROLS</text>
    <text x="770" y="594" class="white" font-size="16" font-weight="600">Midnight City</text>
    <text x="770" y="614" class="muted" font-size="13">M83 · Hurry Up, We're Dreaming</text>
    <rect x="770" y="634" width="270" height="3" rx="2" fill="#f4f7fc" opacity=".16"/>
    <rect x="770" y="634" width="102" height="3" rx="2" fill="#67a8ff"/>
    <text x="770" y="659" class="muted" font-size="10">1:42</text>
    <text x="1010" y="659" class="muted" font-size="10">4:03</text>
    <path d="M856 666l9-7v14z M883 659v14 M895 659v14" fill="#dce7f5"/>
    <circle cx="905" cy="666" r="17" fill="#67a8ff"/>
    <path d="M902 657v18l13-9z" fill="#102036"/>
    <path d="M925 659v14 M937 659v14 M943 666l9-7v14z" fill="#dce7f5"/>
  </g>

  <!-- Floating compact dock. Tile widths follow content; icons sit in their own center group. -->
  <g filter="url(#shadow)">
    <rect x="226" y="722" width="988" height="94" rx="27" fill="url(#dock)" stroke="#dce8f7" stroke-opacity=".20"/>
    <path d="M254 723h932" stroke="#fff" stroke-opacity=".10" stroke-linecap="round"/>

    <rect x="242" y="736" width="154" height="66" rx="17" fill="url(#tile)" stroke="#dce8f7" stroke-opacity=".12"/>
    <circle cx="267" cy="758" r="8" fill="none" stroke="#68788d" stroke-width="3"/>
    <path d="M267 750a8 8 0 0 1 7 4" fill="none" stroke="#67a8ff" stroke-width="3" stroke-linecap="round"/>
    <text x="285" y="760" class="muted label">CPU</text>
    <text x="258" y="786" class="white" font-size="18" font-weight="650">18%</text>
    <text x="322" y="786" class="muted" font-size="11">RAM 62%</text>

    <rect x="404" y="736" width="130" height="66" rx="17" fill="url(#tile)" stroke="#dce8f7" stroke-opacity=".12"/>
    <circle cx="428" cy="759" r="9" fill="#f6c86f" opacity=".95"/>
    <path d="M421 761a8 8 0 0 1 14 0v5h-14z" fill="#e9edf1"/>
    <text x="446" y="760" class="muted label">WEATHER</text>
    <text x="420" y="787" class="white" font-size="18" font-weight="650">24°</text>
    <text x="467" y="787" class="muted" font-size="11">Clear</text>

    <path d="M550 744v50" stroke="#dce8f7" stroke-opacity=".12"/>
    <!-- Three original generic app marks; the live app uses native Windows icons. -->
    <g transform="translate(572 745)">
      <rect width="45" height="45" rx="13" fill="#2779b8"/>
      <path d="M11 13h23v4H11zm0 8h23v3H11zm0 7h16v3H11z" fill="#eaf5ff"/>
    </g>
    <g transform="translate(624 745)">
      <rect width="45" height="45" rx="13" fill="#274c38"/>
      <path d="M10 11h25v23H10z" fill="none" stroke="#a7e0b1" stroke-width="2"/>
      <path d="M15 17h15M15 22h15M15 27h10" stroke="#a7e0b1" stroke-width="2"/>
    </g>
    <g transform="translate(676 745)">
      <rect width="45" height="45" rx="13" fill="#704c32"/>
      <path d="M10 17l12-7 13 7v17H10z" fill="none" stroke="#ffe0ad" stroke-width="2" stroke-linejoin="round"/>
      <path d="M18 34V23h9v11" fill="none" stroke="#ffe0ad" stroke-width="2"/>
    </g>
    <circle cx="644" cy="795" r="3.5" fill="#67a8ff"/>

    <rect x="739" y="736" width="246" height="66" rx="17" fill="url(#tile)" stroke="#dce8f7" stroke-opacity=".12"/>
    <rect x="750" y="746" width="45" height="45" rx="11" fill="#354c68"/>
    <path d="M762 758h20v21h-20z M766 754h20v21" fill="none" stroke="#d6e5f5" stroke-width="1.7" stroke-linejoin="round"/>
    <text x="807" y="758" class="white" font-size="12" font-weight="600">Midnight City</text>
    <text x="807" y="776" class="muted" font-size="11">M83</text>
    <path d="M937 758v18 M948 758v18 M955 767l9-7v14z" fill="#dce7f5"/>
    <rect x="807" y="788" width="163" height="2.5" rx="1" fill="#f4f7fc" opacity=".18"/>
    <rect x="807" y="788" width="57" height="2.5" rx="1" fill="#67a8ff"/>

    <rect x="995" y="736" width="203" height="66" rx="17" fill="url(#tile)" stroke="#dce8f7" stroke-opacity=".12"/>
    <circle cx="1020" cy="760" r="8" fill="none" stroke="#68788d" stroke-width="3"/>
    <path d="M1020 752a8 8 0 0 1 7 4" fill="none" stroke="#67a8ff" stroke-width="3" stroke-linecap="round"/>
    <text x="1036" y="760" class="muted label">FOCUS</text>
    <text x="1012" y="787" class="white" font-size="18" font-weight="650">18:42</text>
    <path d="M1139 748v41" stroke="#dce8f7" stroke-opacity=".12"/>
    <text x="1151" y="763" class="white" font-size="15" font-weight="650">14:32</text>
    <text x="1151" y="781" class="muted" font-size="10">MON · NOV 16</text>
  </g>

  <text x="72" y="864" class="muted" font-size="12">Concept only · compact floating layout · theme, widgets, and app order remain configurable</text>
</svg>

