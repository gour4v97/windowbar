<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="dock" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.96"/>
    </linearGradient>
  </defs>

  <!-- Rounded square app tile -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)"/>
  <rect x="28" y="28" width="456" height="456" rx="104" fill="none" stroke="#38BDF8" stroke-opacity="0.22" stroke-width="4"/>

  <!-- Subtle window grid motif in upper area -->
  <rect x="96" y="108" width="148" height="104" rx="22" fill="#1E293B" stroke="#475569" stroke-width="4"/>
  <rect x="268" y="108" width="148" height="104" rx="22" fill="#1E293B" stroke="#475569" stroke-width="4"/>
  <rect x="116" y="128" width="64" height="12" rx="6" fill="#38BDF8" fill-opacity="0.85"/>
  <rect x="116" y="152" width="108" height="10" rx="5" fill="#64748B" fill-opacity="0.7"/>
  <rect x="288" y="128" width="52" height="12" rx="6" fill="#818CF8" fill-opacity="0.85"/>
  <rect x="288" y="152" width="96" height="10" rx="5" fill="#64748B" fill-opacity="0.7"/>

  <!-- Floating smart dock bar -->
  <rect x="64" y="268" width="384" height="124" rx="36" fill="url(#dock)" stroke="url(#accent)" stroke-width="5"/>

  <!-- Dock app icons / widgets -->
  <rect x="94" y="298" width="64" height="64" rx="18" fill="#38BDF8"/>
  <rect x="178" y="298" width="64" height="64" rx="18" fill="#60A5FA"/>
  <rect x="262" y="298" width="64" height="64" rx="18" fill="#818CF8"/>
  <rect x="346" y="298" width="72" height="64" rx="18" fill="#0F172A" stroke="#38BDF8" stroke-width="4"/>
  <circle cx="382" cy="330" r="14" fill="#38BDF8"/>

  <!-- Active indicator dots under dock items -->
  <circle cx="126" cy="376" r="5" fill="#38BDF8"/>
  <circle cx="294" cy="376" r="5" fill="#A5B4FC"/>
</svg>
